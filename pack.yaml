# Halo Hacker (halo-hacker): authorized security assessment as a Halo pack.
# HALO-PACK.md says how to work on it; README.md lists every part. Every value
# here is checked at install: `halo pack test .` runs every check.
id: halo-hacker
name: Halo Hacker
version: 0.9.0
description: >-
  Authorized security assessment capability pack: eight specialized agent
  roles, five assessment lineups, structured playbooks, engagement scope
  policy, finding schemas, and evidence-driven reporting. Adds security
  assessment to Halo; owns no runtime, routing, or orchestration of its own.
author: Pinball Genie LLC (github.com/roloVibes)
license: All rights reserved — Pinball Genie LLC (see /LICENSE)
halo_api:
  # The extension API version (halo_harness.ext.API_VERSION), not the Halo
  # version. 1.1 is the floor for a pack that declares `requires` tools.
  min: "1.1"
  max: "1.9"
halo:
  # First Halo version this pack is written for (pack test/doctor, API 1.1).
  min: "3.3"
# The capabilities this pack declares. A workflow's `prerequisites.capabilities`
# and a stage's `needs:` must name one of these, and so must every name under
# contributes.fleet.capabilities below.
capabilities:
  - agents        # 8 role bios contributed to the bio registry
  - teams         # 5 lineup templates contributed to the template registry
  - schemas       # engagement / scope / finding / playbook JSON Schemas (pack data files)
  - policies      # engagement + broker policy definitions (docs + schemas)
  - playbooks     # declarative testing workflows (catalog: see PLAYBOOK_CATALOG.md)
  - ingestion     # the pack's own knowledge ingestion MCP server (mcp/ingest_server.py)
  - halo-hacker.assessment  # the fleet advertisement (contributes.fleet below)
# No external tools: every part is Python standard library, plus the network
# that mcp:cve reaches (declared under permissions, not installed by anyone).
requires: []
contributes:
  agents:
    - agents/hh-ai-security-tester.yaml
    - agents/hh-api-tester.yaml
    - agents/hh-judge.yaml
    - agents/hh-orchestrator.yaml
    - agents/hh-recon.yaml
    - agents/hh-reporter.yaml
    - agents/hh-validator.yaml
    - agents/hh-web-tester.yaml
  teams:
    - teams/hh-ai-security-review.yaml
    - teams/hh-api-security-review.yaml
    - teams/hh-cloud-config-assessment.yaml
    - teams/hh-finding-validation-reporting.yaml
    - teams/hh-web-app-assessment.yaml
  skills: skills
  commands: commands
  hooks: hooks/hooks.json
  mcp:
    - {name: ingest, description: knowledge ingestion into the provenance-ledger KB (local notes, PDFs, GitHub files, YouTube subtitles)}
    - {name: cve, description: NVD 2.0 lookup with a rate pacer, CISA KEV checks (24 h cached), FIRST EPSS scores}
  events:
    - {kind: hh.finding, schema: events/hh.finding.json, description: one finding lifecycle moment (identified/reviewed/confirmed/terminal) — how the candidate entered and how far it has traveled}
  studio:
    sections:
      - id: halo-hacker
        title: Halo Hacker
        blurb: Findings for the active engagement — identified, reviewed, confirmed.
        help: >-
          The browser panel is the pack's own script (grant studio-script to
          run it): every finding clickable — full detail, evidence, validation,
          reviewer decision — with filters, search and live refresh. The counts
          and table panels read the pack's data folder, written by
          tools/findings_view.py on every store change (and by
          `findings_view.py auto`). The feed shows hh.finding events.
        panels:
          - id: browser
            title: Findings browser
            kind: bundle
            source: studio/findings.js
            w: 24
            h: 120
            help: >-
              Interactive findings browser: click a row (or Enter on a selected
              row) for the full finding — description, evidence ledger rows,
              validation, reviewer decision, remediation, audit history.
              Filter by severity/state/source, free-text search, copy as
              markdown, open raw JSON. Refreshes on hh.finding events and
              every 15s. Requires the studio-script grant.
          - id: counts
            title: Counts
            kind: table
            source: "data:findings/counts.json"
            columns: [engagement, identified, reviewed, confirmed]
            w: 24
            h: 12
          - id: table
            title: Findings
            kind: table
            source: "data:findings/summary.json"
            columns: [finding_id, title, severity, state, target_ref, source, updated]
            w: 24
            h: 60
          - id: feed
            title: Lifecycle
            kind: events
            w: 24
            h: 40
            help: "hh.finding events as they happen (tester, scanner, import, passive traffic)"
    palette:
      - {id: open-browser, label: Open the findings browser, action: "route:halo-hacker/browser"}
      - {id: open-table, label: Open the findings table, action: "route:halo-hacker/table"}
      - {id: open-lifecycle, label: Open the findings lifecycle feed, action: "route:halo-hacker/feed"}
    config_form: true
  fleet:
    capabilities:
      - name: halo-hacker.assessment
        description: Runs an authorized security assessment on a harness that runs the pack
        requires:
          runtimes: [python]
        capacity:
          parallel: 1
    inspector:
      - label: "Halo Hacker: what a part needs"
        source: fleet/notes.md
    mission:
      metadata:
        pack: halo-hacker
  # schemas/, policies/, playbooks/ and resources/ are the pack's data files,
  # read by its own tools and referenced from the bios — not registry
  # contributions (nothing in Halo reads them directly).
permissions:
  - mcp:ingest    # the knowledge ingestion server (mcp/ingest_server.py)
  - mcp:cve       # thin CVE enrichment (NVD 2.0 + CISA KEV + FIRST EPSS; mcp/cve_server.py)
  - bash          # the PreToolUse scope guard classifies Bash commands against engagement scope
  - hooks         # the pack contributes a PreToolUse hook (hooks/hooks.json)
  - studio-script # the findings browser bundle panel (studio/findings.js)
config:
  schema:
    type: object
    properties:
      vault:
        {type: string, description: "Where the knowledge base lives (the folder the provenance ledger and distilled entries are written under). When empty the server refuses every tool; set it with `halo config set packs.settings.halo-hacker.vault <path>` or the HALO_HACKER_VAULT env var."}
    additionalProperties: false
  defaults:
    vault: ""
migrations: []
