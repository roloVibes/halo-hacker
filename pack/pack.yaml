# Halo Hacker — capability pack manifest for Halo Harness.
#
# Contract: Halo 3.2.0.0 R1 "Packs" (plans/ROADMAP.md, added 2026-10-21).
# The pack registry does not exist in any released Halo yet (see
# CORE_REQUESTS.md CR-1); this manifest follows the documented contract so
# it validates the day `halo pack install` lands. Until then,
# scripts/install-compat.sh is the ONLY supported install path (a clearly
# identified temporary compatibility adapter, never a core patch).
id: halo-hacker
namespace: hh
name: Halo Hacker
version: 0.2.0
description: >-
  Authorized security assessment capability pack: specialized agent roles,
  assessment team lineups, structured playbooks, engagement scope policy,
  finding schemas, and evidence-driven reporting. Adds security assessment
  to Halo; owns no runtime, routing, or orchestration of its own.
author: rolo (roloVibes)
license: Proprietary (unreleased; distribution decision pending leakcheck gate)
halo_api:
  # First Halo version with the pack registry (3.2.0.0 R1). The compat
  # adapter additionally supports 3.0.x-3.1.x manually -- see COMPATIBILITY.md.
  min: 3.2.0.0
  max: ""
capabilities:
  - agents        # 8 role bios contributed to the bio registry
  - teams         # 5 lineup templates contributed to the template registry
  - schemas       # engagement / scope / finding / playbook JSON Schemas
  - policies      # engagement + broker policy definitions (docs + schemas)
  - playbooks     # declarative testing workflows (catalog: see PLAYBOOK_CATALOG.md)
requires: []      # no hard pack dependencies
contributions:
  agents:
    path: agents/
    count: 8
  teams:
    path: teams/
    count: 5
  schemas:
    path: schemas/
    artifacts: [engagement, scope-targets, finding, playbook]
  policies:
    path: policies/
  playbooks:
    path: playbooks/
    count: 16
  skills:
    path: skills/
    count: 0       # populated with methodology content in Milestone 2
  studio: []       # blocked on CORE_REQUESTS.md CR-2 (contribution registry)
  fleet: []        # blocked on CORE_REQUESTS.md CR-3 (fleet capabilities)
  artifacts: []    # Milestone 4 (typed report artifact)
  events: []       # Milestone 4
  config_schema: {}
permissions:
  requested: []    # none at 0.1.0: bios are data only; no tool grants
migrations: []
