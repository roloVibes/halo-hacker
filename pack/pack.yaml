# Halo Hacker — capability pack manifest for Halo Harness.
#
# Contract: Halo 3.2.0.0 R1 "Packs" (plans/ROADMAP.md; docs/EXTENSION_API.md).
# Validated against the shipped `halo pack` implementation (Halo 3.2.1.0).
# The compat adapter still supports 3.0.x-3.1.x manually -- see COMPATIBILITY.md.
id: halo-hacker
name: Halo Hacker
version: 0.4.0
description: >-
  Authorized security assessment capability pack: specialized agent roles,
  assessment team lineups, structured playbooks, engagement scope policy,
  finding schemas, and evidence-driven reporting. Adds security assessment
  to Halo; owns no runtime, routing, or orchestration of its own.
author: rolo (roloVibes)
license: TBD (license decision pending — all rights reserved until then)
halo_api:
  # The extension API version (halo_harness.ext.API_VERSION), not the Halo
  # version; Halo 3.2.0.0 shipped extension API 1.0 with the pack registry.
  min: "1.0"
halo:
  # First Halo version with the pack registry (3.2.0.0 R1).
  min: 3.2.0.0
capabilities:
  - agents        # 8 role bios contributed to the bio registry
  - teams         # 5 lineup templates contributed to the template registry
  - schemas       # engagement / scope / finding / playbook JSON Schemas (pack data files)
  - policies      # engagement + broker policy definitions (docs + schemas)
  - playbooks     # declarative testing workflows (catalog: see PLAYBOOK_CATALOG.md)
requires: []      # no hard pack dependencies
contributes:
  agents:
    - agents/hh-ai-security-tester.yaml
    - agents/hh-api-tester.yaml
    - agents/hh-judge.yaml
    - agents/hh-orchestrator.yaml
    - agents/hh-recon.yaml
    - agents/hh-reporter.yaml
    - agents/hh-validator.yaml
    - agents/hh-web-tester.yaml
  teams:
    - teams/hh-ai-security-review.yaml
    - teams/hh-api-security-review.yaml
    - teams/hh-cloud-config-assessment.yaml
    - teams/hh-finding-validation-reporting.yaml
    - teams/hh-web-app-assessment.yaml
  # schemas/, policies/ and playbooks/ are pack data files (read by the pack's
  # own tooling and referenced from the bios), not registry contributions.
permissions: []   # none: bios and data only; no tool grants
migrations: []
