# Halo Hacker pack -- Web Application Assessment lineup.
name: hh-web-app-assessment
description: >-
  Full web application assessment: recon maps the surface, the web tester
  runs the playbooks, the validator independently reproduces candidates,
  the judge gates them, the reporter drafts the report.
version: 1
tags: [halo-hacker, web, assessment]
about: >-
  Order matters: recon completes before discovery is dispatched; every
  candidate goes validator -> judge -> reporter; nothing is confirmed on
  the tester's word alone.
agents:
  - {agent: hh-orchestrator, role: main, as: orchestrator}
  - {agent: hh-recon, role: researcher, as: recon}
  - {agent: hh-web-tester, role: subagent, as: web}
  - {agent: hh-validator, role: subagent, as: validate}
  - {agent: hh-judge, role: judge, as: judge}
  - {agent: hh-reporter, role: subagent, as: report}
delegation:
  mode: by-skill
  max_parallel: 3
  max_depth: 2
  handoff: summary
routing:
  inventory: recon
  playbook-execution: web
  validation: validate
  review: judge
  reporting: report
  default: orchestrator
budget:
  max_budget_usd: 40
permissions:
  mode: auto
