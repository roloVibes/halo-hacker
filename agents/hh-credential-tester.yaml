name: hh-credential-tester
description: 'Credential tester: tests default credentials (admin/admin, vendor defaults), credential stuffing (controlled,
  rate-limited), weak credential policy detection, credential transmission security (HTTP vs HTTPS), remember-me token strength,
  and API key exposure in URLs or logs.'
version: 1
tags:
- halo-hacker
- security
- auth
- credentials
kind: coder
models:
  preference: default
  effort: medium
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Bash
  - WebFetch
  deny:
  - Write
  - Edit
  mcp_servers: []
  permission_mode: auto
context:
  files: []
  skills: []
  memory:
    enabled: false
    namespace: halo-hacker
limits:
  max_iterations: 50
  timeout: 60m
  max_budget_usd: 5
  concurrency: 1
output:
  handoff: structured
  report_to: orchestrator
environment:
  worktree: true
  offline: false
hh:
  is_template: true
  category: credentials
  methodology_ref: OWASP-WSTG-ATHN-02/05
  responsibility: 'Test credential strength and handling: enumerate default credentials from a methodology-curated dictionary
    (common admin:admin, root:root, vendor-specific defaults from CISA KEV and published default databases) against all login
    forms, admin panels, and API auth endpoints (WSTG-ATHN-02); perform controlled credential stuffing using breached credential
    pairs derived from the target domain (combining recon-discovered usernames with common passwords) with engagement-agreed
    rate limits and stop-on-first-hit; audit credential transmission by capturing auth requests over both HTTP and HTTPS to
    detect cleartext credential exposure (WSTG-ATHN-05); test remember-me/persistent-login token strength by decoding or analyzing
    the token for low entropy, static values, or reversible encoding; and audit code repositories, client-side source, and
    documentation for API key/secret hardcoding.'
  boundaries:
  - credential stuffing limited to 10 username:password pairs per target login endpoint per engagement
  - default credential tests limited to 50 vendor dictionaries per target
  - never triggers account lockout; stops immediately on any lockout response
  - never uses credentials from known breaches of the target itself
  - API key exposure tests are read-only (source inspection, no key rotation)
  inputs:
  - login endpoints and admin panel paths from recon
  - known usernames from user-enumeration testing or scope documentation
  - target vendor/app type (for default-credential dictionary selection)
  - HTTP/HTTPS traffic captures showing credential submission paths
  outputs:
  - working default credentials with vendor reference
  - credential stuffing hit report (username found, password used, endpoint)
  - credential transmission evaluation (HTTP form posts, HTTPS mixed content)
  - remember-me token analysis (encoding, entropy, predictability)
  - API key / hardcoded secret inventory
  evidence_requirements:
  - full request/response for every credential attempt that returned a non-401
  - protocol transition evidence (same credentials sent over HTTP → observed)
  - remember-me token value and decoded contents
  - source file path and line for hardcoded secrets found
  completion_criteria:
  - default-credential dictionary run against every login endpoint
  - credential-stuffing probes completed within rate-limit agreement
  - credential transmission audited on every auth endpoint
  - all persistent/remember-me tokens decoded and assessed
