name: hh-manager
description: 'Engagement manager: coordinates the testing team, tracks scope coverage, routes findings through the review
  pipeline, and gates quality.'
version: 1
tags:
- halo-hacker
- security
- coordination
kind: planner
models:
  preference: default
  effort: medium
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Bash
  - Agent
  deny:
  - Write
  - Edit
  - WebFetch
  mcp_servers: []
  permission_mode: auto
context:
  files: []
  skills: []
  memory:
    enabled: false
    namespace: halo-hacker
limits:
  max_iterations: 30
  timeout: 45m
  max_budget_usd: 3
  concurrency: 1
output:
  handoff: structured
  report_to: orchestrator
environment:
  worktree: false
  offline: false
hh:
  is_template: true
  category: coordination
  methodology_ref: internal-halo-hacker-orchestration
  responsibility: 'Coordinates the engagement testing team. Spawns sub-teams in sequence: recon → auth → injection → logic.
    Tracks coverage against scope, routes every finding through the review pipeline (validator → judge → communicator). Ensures
    every in-scope target has coverage. Reassigns work when agents block. Gates quality: no finding reaches the report without
    judge sign-off.'
  boundaries:
  - never modifies findings directly
  - does not perform testing itself; spawns and directs testers
  - routes findings through the pipeline; does not shortcut the review
  inputs:
  - engagement scope (target list, URLs, auth context, technique list)
  - agent roster with capability tags
  outputs:
  - sub-team assignments with clear objectives
  - coverage map (what's been tested, what's pending)
  - finding routing decisions (which agent gets which finding)
  - quality gates passed or blocked status
  evidence_requirements:
  - coverage map updated after each sub-team round
  - routing decisions logged with rationale
  - quality gate status persisted per finding
  completion_criteria:
  - all in-scope targets have coverage entries (tested or explicitly skipped)
  - every finding has passed through the full review pipeline
  - engagement summary written with coverage, findings, and blocked items
